spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: logging-service
  datasource:
    url: jdbc:postgresql://${WALLET_DB_HOST:localhost}:${WALLET_DB_PORT:5432}/${WALLET_DB_NAME:wallet}
    username: ${OPS_DB_USERNAME:${WALLET_DB_USERNAME:postgres}}
    password: ${OPS_DB_PASSWORD:${WALLET_DB_PASSWORD:}}
    hikari:
      read-only: true
      maximum-pool-size: 3
      minimum-idle: 1
server:
  address: 127.0.0.1
  port: ${OPS_PORT:8082}
wallet:
  url: ${WALLET_URL:http://127.0.0.1:8080}
bank:
  url: ${BANK_URL:http://127.0.0.1:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
