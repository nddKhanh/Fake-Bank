spring:
  profiles:
    default: ui
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${WALLET_DB_HOST:localhost}:${WALLET_DB_PORT:5433}/${WALLET_DB_NAME:wallet}
    username: ${WALLET_DB_USERNAME:wallet}
    password: ${WALLET_DB_PASSWORD:wallet-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
server:
  port: ${WALLET_PORT:8080}
bank:
  url: ${BANK_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
